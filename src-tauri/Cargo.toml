[package]
name = "myshkin"
version = "0.1.0"
description = "Myshkin — The Novel Writing Studio"
authors = ["Myshkin contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "myshkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
